name: Flex Math checks
on:
  push:
    branches: [main, feature/underwater-ruins-level3]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check state.js
          node --check learning.js
      - name: Verify mission behavior
        run: npm test
